<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueryCafe expected outputs</title>
<!-- Makes every lesson's built-in Expected output: runs each lesson's
     solution the way lesson.js would live, and writes what it shows into
     js/curriculum/expected.js, stamped with curriculum/index.js
     expectedStamp. Only works on the local server (serve.ps1 takes the
     write); not linked from the app. Run it after adding or changing
     lessons, or after changing how an engine draws its output (tests.html
     lists missing or stale lessons, but can't see an engine change). -->
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; background: #faf7f0; color: #1f1712; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
  progress { width: 100%; }
  .fail { color: #a8321e; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<h1>Expected outputs</h1>
<p>Runs each lesson's solution and writes what it shows into <code>js/curriculum/expected.js</code>.
By default only lessons that are missing, or changed since, are run again; the rest are kept.</p>
<div class="controls">
  <label><input type="checkbox" id="all"> Run every one again</label>
  <label>Lessons starting <input id="prefix" size="8" placeholder="all"></label>
  <button id="run" disabled>Make them</button>
  <button id="stop">Stop</button>
</div>
<p id="status">Warming up Python…</p>
<progress id="bar" value="0" max="1"></progress>
<ul id="fails"></ul>

<script type="module">
import { python } from './js/python.js';
import { ALL_LESSONS, lessonPrelude, expectedStamp } from './js/curriculum/index.js';
import { answerOnly } from './js/ui.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let stopping = false;

// The file's opening comment, kept word for word on every write.
const HEAD = `/* Every lesson's Expected output, built in, so a lesson shows it the moment
   its fold opens without running anything. Made by expected.html, which
   runs each solution and writes this file: don't edit it by hand.
   Each entry: stamp (curriculum/index.js expectedStamp: the answer, data
   and settings it was made from; lesson.js works it out live instead if it
   no longer matches) and out (what the run showed, as ui.js outputBlocks
   draws it, charts included; an Excel answer already cut to the cells it
   fills). */
`;

python.boot();
python.whenReady(() => { $('run').disabled = false; $('status').textContent = 'Ready.'; });
$('stop').addEventListener('click', () => { stopping = true; });

// Only what Expected output draws (ui.js outputBlocks), charts included.
function entry(L, out) {
  const keep = { stdout: out.stdout || '' };
  if (out.images && out.images.length) keep.images = out.images;
  if (out.grids && out.grids.length) keep.grids = out.grids;
  const blocks = answerOnly(out.blocks);
  if (blocks.length) keep.blocks = blocks;
  if (out.echo) keep.echo = out.echo;
  return { stamp: expectedStamp(L), out: keep };
}

$('run').addEventListener('click', async () => {
  stopping = false;
  $('run').disabled = true;
  $('fails').innerHTML = '';
  // What's there now (never the cached copy), so unchanged lessons are kept.
  const { EXPECTED } = await import(`./js/curriculum/expected.js?t=${Date.now()}`).catch(() => ({ EXPECTED: {} }));
  const entries = { ...EXPECTED };
  const prefix = $('prefix').value.trim();
  const lessons = ALL_LESSONS.filter((L) => !prefix || L.id.startsWith(prefix));
  $('bar').max = lessons.length;
  let made = 0;
  let failed = 0;
  for (let i = 0; i < lessons.length && !stopping; i += 1) {
    const L = lessons[i];
    $('bar').value = i + 1;
    $('status').textContent = `${i + 1} of ${lessons.length} · ${L.id} · ${made} made · ${failed} failed`;
    // Kept: an entry made from this version of the lesson. (One marked live, from
    // before charts were built in, has no out and is made again.)
    if (!$('all').checked && entries[L.id] && entries[L.id].out && entries[L.id].stamp === expectedStamp(L)) continue;
    // Just as lesson.js runs it live: no check, a fresh namespace.
    const out = await python.run({
      code: L.solution, key: 'expected', prelude: lessonPrelude(L), needs: L.needs || [], lang: L.lang, timeoutMs: 120000,
    });
    if (!out.ok) {
      failed += 1;
      $('fails').insertAdjacentHTML('beforeend', `<li class="fail"><b>${esc(L.id)}</b><pre>${esc(out.error || 'no result')}</pre></li>`);
      continue;
    }
    entries[L.id] = entry(L, out);
    made += 1;
  }
  // Path order, one lesson a line; lessons that no longer exist are dropped.
  const body = ALL_LESSONS.filter((L) => entries[L.id])
    .map((L) => `  ${JSON.stringify(L.id)}: ${JSON.stringify(entries[L.id])},`).join('\n');
  const saved = await fetch('__expected', { method: 'POST', body: `${HEAD}export const EXPECTED = {\n${body}\n};\n` });
  $('status').textContent = saved.ok
    ? `${stopping ? 'Stopped' : 'Done'}: ${made} made, ${failed} failed, written to js/curriculum/expected.js.`
    : "Couldn't write js/curriculum/expected.js: is this the local server (serve.ps1)?";
  $('status').className = failed || !saved.ok ? 'fail' : '';
  $('run').disabled = false;
});
</script>
</body>
</html>
