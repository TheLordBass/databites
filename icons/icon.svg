<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="QueryCafe">
  <!-- A cup of coffee from the side, tipped just enough to see the coffee
       in it, and the steam rising off it is a bar chart. -->
  <rect width="512" height="512" rx="112" fill="#4f6b26"/>
  <g transform="translate(0 -18)">
    <!-- the saucer and its shadow -->
    <ellipse cx="256" cy="454" rx="172" ry="24" fill="#38501a"/>
    <ellipse cx="256" cy="444" rx="172" ry="24" fill="#f6ede0"/>
    <!-- the steam: a bar chart, rising -->
    <rect x="180" y="166" width="44" height="106" rx="15" fill="#dcae9a"/>
    <rect x="234" y="124" width="44" height="148" rx="15" fill="#ecd3c6"/>
    <rect x="288" y="80" width="44" height="192" rx="15" fill="#fff7ec"/>
    <!-- the handle, then the cup -->
    <path d="M392 300 H412 A50 50 0 0 1 412 400 H378" fill="none" stroke="#f6ede0" stroke-width="28"/>
    <path d="M116 272 H396 V304 C396 388 336 436 256 436 C176 436 116 388 116 304 Z" fill="#f6ede0"/>
    <!-- the rim, and the coffee in it -->
    <ellipse cx="256" cy="272" rx="140" ry="28" fill="#fffaf2"/>
    <ellipse cx="256" cy="272" rx="122" ry="19" fill="#3b2416"/>
    <ellipse cx="256" cy="272" rx="122" ry="19" fill="none" stroke="#9a6036" stroke-width="5"/>
  </g>
</svg>
