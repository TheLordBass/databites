<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Learn pandas, seaborn and matplotlib in tiny bites. Real Python, right in your pocket.">
<title>DataBites — pandas / seaborn / matplotlib</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ───────────────────────── Boot ───────────────────────── -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <p class="boot-kicker">Python, in your pocket</p>
    <h1 class="boot-word">DataBites</h1>
    <div class="boot-rule"><i id="boot-bar"></i></div>
    <p class="boot-status" id="boot-status">Waking up Python</p>
  </div>
  <p class="boot-foot">First launch downloads Python.<br>After that it works offline.</p>
</div>

<!-- ───────────────────────── App ───────────────────────── -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <button class="back" id="nav-back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5l-7 7 7 7"/></svg>
    </button>
    <div class="topbar-title" id="topbar-title">DataBites</div>
    <div class="streak" id="streak-chip" title="Day streak">
      <span id="streak-count">0</span><span class="streak-unit">day</span>
    </div>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-route="home"><span>Today</span></button>
    <button class="tab" data-route="tracks"><span>Tracks</span></button>
    <button class="tab" data-route="play"><span>Sandbox</span></button>
    <button class="tab" data-route="you"><span>You</span></button>
  </nav>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
